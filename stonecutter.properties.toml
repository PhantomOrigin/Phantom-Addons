# Centralized version properties. See https://stonecutter.kikugie.dev/wiki/config/properties
mod.id = "phantomaddons"
mod.name = "PhantomAddons"
mod.group = "com.phantomaddons"
mod.version = "1.6.24"
# Jar filename prefix — kept distinct from mod.id (which must stay lowercase for fabric.mod.json)
# since UpdateChecker.java's ARCHIVE_BASE_NAME constant expects this exact capitalization when
# matching GitHub release asset names, and GitHub's asset lookup is case-sensitive.
mod.archives_base_name = "PhantomAddons"

# The Loom plugin version itself is hardcoded in build.gradle.kts (one recent Loom release
# targets both Minecraft versions here — they're adjacent releases, not an old/new Loom API
# split — and plugin versions can't be read from these properties inside a plugins {} block).

["26.1.x"]
mod.mc_compat = "~26.1.2"
mod.mc_releases = ["26.1.2"]

deps.fabric_loader = "0.19.2"
deps.fabric_api = "0.153.0+26.1.2"

["26.2.x"]
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]

deps.fabric_loader = "0.19.3"
deps.fabric_api = "0.156.0+26.2"

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly fileTree(dir: 'libs', include: '*.jar')
}

loom {
	mods {
		"phantomaddons" {
			sourceSet sourceSets.main
		}
	}
}

// Three build variants from one codebase — see Edition.java.
//   ./gradlew build                    -> edition=full (default)
//   ./gradlew build -Pedition=noauto   -> full feature set, no in-mod auto-download
//   ./gradlew build -Pedition=standard -> no AutoGFS/CannonAutoClose/PearlRefill, no auto-download (Modrinth-safe)
def editionKey = (project.findProperty('edition') ?: 'full').toString().toLowerCase()
def editions = [
	full:     [name: 'FULL',                 suffix: 'full'],
	noauto:   [name: 'FULL_NO_AUTO_UPDATE',   suffix: 'full-noautoupdate'],
	standard: [name: 'STANDARD',              suffix: ''],
]
def edition = editions[editionKey]
if (edition == null) {
	throw new GradleException("Unknown edition '${editionKey}' — expected one of: ${editions.keySet()}")
}

// UpdateInstaller.java holds the actual download/jar-swap code. Only the full edition
// compiles it in at all — the other two editions don't just have it disabled, they
// don't contain that code, full stop. UpdateChecker only ever reaches it via
// reflection, so its compilation isn't affected by this exclusion.
if (editionKey != 'full') {
	sourceSets.main.java {
		exclude 'com/kuudrahelper/UpdateInstaller.java'
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "edition", edition.name
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	filesMatching("edition.properties") {
		expand "edition": edition.name
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	archiveClassifier.set(edition.suffix)
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Builds all three edition jars in one command. Each edition is a genuinely separate
// Gradle invocation (project properties like `edition` are only read once, at
// configuration time, so a single `build` run can't produce more than one) — this just
// shells out to the wrapper three times so you don't have to.
tasks.register('buildAllEditions') {
	group = 'build'
	description = 'Builds the full, noauto, and standard edition jars in one command.'
	doLast {
		def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
		['full', 'noauto', 'standard'].each { ed ->
			def wrapper = new File(project.projectDir, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
			def command = (isWindows
				? ['cmd', '/c', wrapper, 'build', "-Pedition=${ed}"]
				: [wrapper, 'build', "-Pedition=${ed}"])*.toString()
			def process = new ProcessBuilder(command)
				.directory(project.projectDir)
				.redirectErrorStream(true)
				.start()
			process.inputStream.eachLine { println it }
			int exitCode = process.waitFor()
			if (exitCode != 0) {
				throw new GradleException("Build for edition '${ed}' failed with exit code ${exitCode}")
			}
		}
	}
}